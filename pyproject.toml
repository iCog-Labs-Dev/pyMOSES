[project]
name = "pymoses"
version = "0.0.1"
description = "Python port of classic OpenCog MOSES, aligned to the C++ source"
requires-python = ">=3.14"
dependencies = []
# Classic MOSES is dual-licensed ("MOSES has a double license, Apache 2.0 and
# AGPL 3.0." -- its one-line LICENSE), and a port carries the original terms,
# so this repo ships classic's three licence files verbatim and declares the
# same disjunction here.
license = "Apache-2.0 OR AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE.AGPL", "LICENSE.Apache"]

# Installed command names mirror classic's, where the CMake TARGET names
# differ from the installed BINARY names: target `moses-exec` installs as
# `moses`, and target `fs-main` as `feature-selection` (see CLAUDE.md's
# "CMake target names do not match binary names").
[project.scripts]
moses = "pymoses.moses.main.moses_exec:_console_main"
feature-selection = "pymoses.feature_selection.main.fs_main:_console_main"
eval-features = "pymoses.feature_selection.main.eval_features:_console_main"

# Only the pymoses package is installed; configs/, tools/, benchmarks/ etc. are repo
# folders, not packages (flat-layout auto-discovery otherwise refuses to build).
[tool.setuptools.packages.find]
include = ["pymoses*"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# A @pytest.mark.parametrize collection over an EMPTY sequence (e.g. a
# corpus fixture JSON that failed to load, or was silently truncated to
# `{}`) is not an error by pytest's own default -- it just produces zero
# tests, and `ci.sh` exits 0 having "run" nothing. This project's whole
# oracle-testing strategy depends on parametrized corpora actually
# containing cases, so an empty parameter set is promoted to a hard
# failure globally, project-wide -- not just for the one test module a
# prior fix round happened to notice it in (tests/util/test_rng.py).
# `"fail_at_collect"` is this pytest version's (9.1.0) actual spelling of
# the "hard failure" option -- `pytest --help` rejects a bare `"fail"`
# outright ("must be one of skip, xfail or fail_at_collect"); confirmed
# by trying it.
empty_parameter_set_mark = "fail_at_collect"
markers = [
  "oracle: differential test comparing against committed C++ golden fixtures",
  "live: requires rebuilding the C++ probes; excluded from the default run",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
# C++ identifiers are preserved verbatim so the Python can be diffed against the
# C++ by eye. See docs/superpowers/specs/2026-09-02-pymoses-foundation-design.md
# section 5.1. This is the single most load-bearing convention in the project.
ignore = ["N801", "N802", "N803", "N806", "N815", "N818"]
